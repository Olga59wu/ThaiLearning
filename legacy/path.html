        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 20 20" fill="currentColor">

        <div id="input-char" contenteditable="true" 
    class="text-5xl border-2 border-emerald-100 focus:border-emerald-500 outline-none rounded-xl w-full text-center thai-font h-24 flex items-center justify-center bg-white transition-all overflow-visible pt-2"
    oninput="drawGuide()"></div>

</div>
            
            <div class="space-y-1 bg-slate-50 p-2 rounded-xl border border-slate-200">

                    <h1 class="text-xs font-bold text-gray-700">2. 圓潤度 (Smoothness)</h1>

<script type="module">
    import { thaiData } from './data/thai.js'; 
    import { jpData } from './data/japanese.js';

    // 變數與綁定
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const previewPath = document.getElementById('preview-path');
    const inputChar = document.getElementById('input-char');
    const guideText = document.getElementById('guide-text');
    const output = document.getElementById('output-path');
    const smoothVal = document.getElementById('smooth-val');
    const importInput = document.getElementById('import-input');
    const pickerModal = document.getElementById('picker-modal');
    const pickerGrid = document.getElementById('picker-grid');
    
    let strokes = [ [] ]; 
    let tension = 0.5;
    let currentCharObj = null;

    const CANVAS_SIZE = 500;
    const TARGET_SIZE = 100;
    const SCALE_FACTOR = TARGET_SIZE / CANVAS_SIZE; 
    const HIT_RADIUS = 15;

    let isDragging = false;
    let dragStrokeIndex = -1; 
    let dragPointIndex = -1;
    let hoverStrokeIndex = -1;
    let hoverPointIndex = -1;

    // --- 功能函式 ---

    function nextStroke() {
        const currentStroke = strokes[strokes.length - 1];
        if (currentStroke.length > 0) {
            strokes.push([]); 
            render();
            canvas.style.backgroundColor = '#f0fdf4'; 
            setTimeout(() => canvas.style.backgroundColor = '', 150);
        }
    }

    function openCharPicker() {
        pickerModal.classList.remove('hidden');
        renderPicker('thai_con');
    }

    function closeCharPicker(e) {
        if (!e || e.target.id === 'picker-modal' || !e.target.closest) {
            pickerModal.classList.add('hidden');
        }
    }

    function selectChar(char) {
    inputChar.textContent = char; // 改用 textContent
    drawGuide();
    pickerModal.classList.add('hidden');

    let foundItem = thaiData.find(d => d.char === char) || 
                    jpData.find(d => d.char === char);

    if (!foundItem) {
         foundItem = thaiData.find(d => d.char.replace(/◌/g, '-') === char);
    }

    currentCharObj = foundItem;

    if (foundItem && foundItem.strokes && foundItem.strokes.length > 0) {
        strokes = []; 
        foundItem.strokes.forEach(pathString => {
            const points = parseSVGPath(pathString);
            if (points.length > 0) {
                strokes.push(points);
            }
        });
        if (strokes.length === 0) strokes.push([]);
        render(); 
    } else {
        clearPath();
    }
}

    function renderPicker(type) {
        document.querySelectorAll('.picker-tab').forEach(btn => {
            const isActive = btn.getAttribute('onclick').includes(type);
            btn.className = isActive 
                ? 'picker-tab px-4 py-2 rounded-lg text-sm font-bold bg-emerald-500 text-white shadow-sm transition-all whitespace-nowrap'
                : 'picker-tab px-4 py-2 rounded-lg text-sm font-bold bg-white text-gray-600 hover:bg-gray-100 border border-gray-200 transition-all whitespace-nowrap';
        });

        pickerGrid.innerHTML = '';
        let list = [];

        if (type === 'thai_con') list = thaiData.filter(d => d.type === 'consonant').map(d => ({ char: d.char, label: d.reading }));
        else if (type === 'thai_vow') list = thaiData.filter(d => d.type === 'vowel').map(d => ({ char: d.char.replace(/◌/g, '-'), realChar: d.char, label: d.reading }));
        else if (type === 'thai_num') list = thaiData.filter(d => d.type === 'numbers').map(d => ({ char: d.char, label: d.reading }));
        else if (type === 'jp_hira') list = jpData.filter(d => d.type === 'hiragana').map(d => ({ char: d.char, label: d.romaji }));
        else if (type === 'jp_kata') {
             const k = jpData.filter(d => d.type === 'katakana');
             list = k.length ? k.map(d=>({char:d.char, label:d.romaji})) : jpData.filter(d=>d.type==='hiragana'&&d.pair).map(d=>({char:d.pair, label:d.romaji}));
        }

        list.forEach(item => {
            const btn = document.createElement('button');
            btn.className = 'flex flex-col items-center justify-center p-2 bg-white rounded-xl border border-gray-200 shadow-sm hover:border-emerald-500 hover:ring-2 hover:ring-emerald-500 hover:bg-emerald-50 transition-all h-24 group';
            btn.innerHTML = `<span class="text-3xl font-bold text-gray-700 group-hover:text-emerald-600 thai-font mb-1">${item.realChar || item.char}</span><span class="text-xs text-gray-400 uppercase group-hover:text-emerald-500 font-mono">${item.label || ''}</span>`;
            btn.onclick = () => selectChar(item.realChar || item.char);
            pickerGrid.appendChild(btn);
        });
    }

   function drawGuide() {
    // 1. 改用 textContent 取得 div 內的文字 (針對 contenteditable)
    const char = inputChar.textContent; 
    guideText.textContent = char;
    
    // 2. 保留強制置中樣式，確保畫布背景字不會偏移
    guideText.style.display = 'flex';
    guideText.style.alignItems = 'center';
    guideText.style.justifyContent = 'center';

    // 3. 判斷字元是否變更，若變更則斷開與舊物件的連結
    if (currentCharObj && currentCharObj.char !== char) {
        currentCharObj = null;
    }
    
    render();
}

    function updateSmoothness(val) {
        tension = parseFloat(val);
        smoothVal.textContent = tension;
        render();
    }

    function undo() {
        const currentStroke = strokes[strokes.length - 1];
        if (currentStroke.length > 0) {
            currentStroke.pop(); 
        } else if (strokes.length > 1) {
            strokes.pop(); 
            strokes[strokes.length - 1].pop(); 
        }
        render();
    }
    
    function clearPath() { 
        strokes = [ [] ]; 
        render(); 
    }
    
    function copyCode() {
        if(!output.value) return;
        output.select();
        document.execCommand('copy');
        const btn = document.getElementById('btn-copy');
        const originalHTML = btn.innerHTML;
        btn.innerHTML = '<span>✅ 已複製</span>';
        btn.classList.replace('bg-emerald-500', 'bg-slate-700');
        setTimeout(() => {
            btn.innerHTML = originalHTML;
            btn.classList.replace('bg-slate-700', 'bg-emerald-500');
        }, 1000);
    }

    // ✨✨ 核心修改：強化匯入功能 (修復字底圖 & 完整物件解析) ✨✨
    function importPath() {
        let rawInput = importInput.value;
        if (!rawInput) return;

        // 1. 嘗試解析 "char" 屬性來顯示字底圖
        // 尋找 char: 'X' 或 char: "X"
        const charMatch = rawInput.match(/char:\s*['"]([^'"]+)['"]/);
        if (charMatch && charMatch[1]) {
            const importedChar = charMatch[1];
            inputChar.textContent = importedChar;
            drawGuide(); // 這一行會更新畫布背景的字底圖

            // 嘗試與資料庫連結 (為了保留其他屬性如 img, reading...)
            let foundItem = thaiData.find(d => d.char === importedChar) || 
                            jpData.find(d => d.char === importedChar);
            
            if (foundItem) {
                currentCharObj = foundItem;
            } else {
                // 如果是新字 (資料庫沒有)，我們至少記住這個 char，以便輸出時能生成基本結構
                currentCharObj = { char: importedChar };
            }
        }

        // 2. 解析 strokes
        const matches = rawInput.match(/['"](M[^'"]+)['"]/g);
        
        if (matches && matches.length > 0) {
            strokes = [];
            matches.forEach(pathStr => {
                let cleanPath = pathStr.replace(/['"]/g, '');
                let points = parseSVGPath(cleanPath);
                if(points.length > 0) strokes.push(points);
            });
            if (strokes.length === 0) strokes.push([]);
        } else {
            // 相容舊模式 (只貼上單一路徑)
            let pathData = rawInput;
            if(rawInput.includes('M')) {
                 let start = rawInput.indexOf('M');
                 let end = rawInput.lastIndexOf("'");
                 if(end === -1) end = rawInput.lastIndexOf('"');
                 if(end < start) end = rawInput.length;
                 pathData = rawInput.substring(start).replace(/['"],?$/, '').trim();
            }
            let points = parseSVGPath(pathData);
            strokes = [ points ];
        }

        render();
        importInput.value = '';
        importInput.placeholder = "✅ 匯入成功！字底圖與筆順已更新";
        setTimeout(() => {
            importInput.placeholder = "在此貼上完整物件代碼 (包含 char 和 strokes)";
        }, 3000);
    }

    function parseSVGPath(pathData) {
    if (!pathData.startsWith('M')) return [];
    const commandPattern = /([MLQ])\s*([^MLQ]*)/g;
    let commands = [];
    let m;
    while ((m = commandPattern.exec(pathData)) !== null) {
        let args = m[2].trim().split(/[\s,]+/).map(Number);
        commands.push({ type: m[1], args: args });
    }
    let newPoints = [];
    const hasCurves = pathData.includes('Q');
    if (commands.length > 0 && commands[0].type === 'M') {
        newPoints.push({ x: commands[0].args[0], y: commands[0].args[1] });
    }
    for (let i = 1; i < commands.length; i++) {
        let cmd = commands[i];
        if (cmd.type === 'Q') {
            newPoints.push({ x: cmd.args[0], y: cmd.args[1] });
        } else if (cmd.type === 'L') {
            if (!hasCurves || i === commands.length - 1) {
                newPoints.push({ x: cmd.args[0], y: cmd.args[1] });
            }
        }
    }

    // 調整對齊位移量，讓 Strokes 向上 (減少 Y) 並向右 (增加 X) 移動
    const offsetX = -2; // 調整水平位置 (單位 0-100)
    const offsetY = 18; // 調整垂直位置 (向上移 18 單位)
    
    return newPoints.map(p => ({ 
        x: (p.x - offsetX) / SCALE_FACTOR, 
        y: (p.y - offsetY) / SCALE_FACTOR 
    }));
}

    // --- 演算法 ---
    function getSmoothedPathString(pts, smoothFactor) {
    if (pts.length < 2) return "";
    // 修改這裡：傳入 true 代表處理 X 座標
    let d = `M ${round(pts[0].x, true)} ${round(pts[0].y, false)}`;
    
    if (pts.length === 2) { 
        d += ` L ${round(pts[1].x, true)} ${round(pts[1].y, false)}`; 
        return d; 
    }
    
    if (smoothFactor === 0) {
        for (let i = 1; i < pts.length; i++) 
            d += ` L ${round(pts[i].x, true)} ${round(pts[i].y, false)}`;
        return d;
    }
    
    for (let i = 1; i < pts.length - 1; i++) {
        let prev = pts[i-1];
        let curr = pts[i];
        let next = pts[i+1];
        let f = Math.min(smoothFactor, 0.5);
        let v1 = { x: curr.x - prev.x, y: curr.y - prev.y };
        let v2 = { x: next.x - curr.x, y: next.y - curr.y };
        let startQ = { x: curr.x - v1.x * f, y: curr.y - v1.y * f };
        let endQ = { x: curr.x + v2.x * f, y: curr.y + v2.y * f };
        
        d += ` L ${round(startQ.x, true)} ${round(startQ.y, false)}`;
        d += ` Q ${round(curr.x, true)} ${round(curr.y, false)} ${round(endQ.x, true)} ${round(endQ.y, false)}`;
    }
    d += ` L ${round(pts[pts.length-1].x, true)} ${round(pts[pts.length-1].y, false)}`;
    return d;
}

    // 加入相同的 offsetY 補償，確保存檔後的座標是正確的
    function round(val, isX = false) { 
    // 必須與 parseSVGPath 中的數值完全對應
    const offsetX = -2; 
    const offsetY = 18; 
    
    if (isX) {
        return Math.round((val * SCALE_FACTOR + offsetX) * 10) / 10;
    } else {
        return Math.round((val * SCALE_FACTOR + offsetY) * 10) / 10;
    }
} 

    function getSmoothedPathStringPreview(pts, smoothFactor) {
        if (pts.length < 2) return "";
        let d = `M ${pts[0].x} ${pts[0].y}`;
        if (pts.length === 2) { d += ` L ${pts[1].x} ${pts[1].y}`; return d; }
        if (smoothFactor === 0) {
            for (let i = 1; i < pts.length; i++) d += ` L ${pts[i].x} ${pts[i].y}`;
            return d;
        }
        for (let i = 1; i < pts.length - 1; i++) {
            let prev = pts[i-1];
            let curr = pts[i];
            let next = pts[i+1];
            let f = Math.min(smoothFactor, 0.5);
            let v1 = { x: curr.x - prev.x, y: curr.y - prev.y };
            let v2 = { x: next.x - curr.x, y: next.y - curr.y };
            let startQ = { x: curr.x - v1.x * f, y: curr.y - v1.y * f };
            let endQ = { x: curr.x + v2.x * f, y: curr.y + v2.y * f };
            d += ` L ${startQ.x} ${startQ.y}`;
            d += ` Q ${curr.x} ${curr.y} ${endQ.x} ${endQ.y}`;
        }
        d += ` L ${pts[pts.length-1].x} ${pts[pts.length-1].y}`;
        return d;
    }

    function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        let svgPreviewString = '';
        let resultStrings = [];

        strokes.forEach((points, sIdx) => {
            if (points.length === 0) return;

            // 骨架
            ctx.beginPath();
            ctx.lineWidth = 1;
            ctx.setLineDash([5, 5]);
            ctx.strokeStyle = '#94a3b8';
            ctx.moveTo(points[0].x, points[0].y);
            for (let i = 1; i < points.length; i++) { ctx.lineTo(points[i].x, points[i].y); }
            ctx.stroke();
            ctx.setLineDash([]);

            // 控制點
            points.forEach((p, pIdx) => {
                ctx.beginPath();
                if (sIdx === dragStrokeIndex && pIdx === dragPointIndex || 
                    sIdx === hoverStrokeIndex && pIdx === hoverPointIndex) {
                    ctx.fillStyle = '#f97316'; 
                    ctx.arc(p.x, p.y, 6, 0, Math.PI * 2);
                } else if (pIdx === 0) {
                    ctx.fillStyle = '#10b981'; 
                    ctx.arc(p.x, p.y, 5, 0, Math.PI * 2);
                } else {
                    ctx.fillStyle = '#3b82f6'; 
                    ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
                }
                ctx.fill();
            });

            // Path
            const pathStr = getSmoothedPathString(points, tension);
            const prevStr = getSmoothedPathStringPreview(points, tension);
            
            svgPreviewString += prevStr + " ";
            resultStrings.push(pathStr);
        });

        previewPath.setAttribute('d', svgPreviewString);

        if (resultStrings.length > 0) {
            if (currentCharObj) {
                // 有物件時：複製物件並替換 strokes，輸出完整結構
                const newObj = { ...currentCharObj };
                newObj.strokes = resultStrings;
                output.value = objectToString(newObj) + ','; 
            } else {
                // 無物件時 (自創字)：只輸出 strokes 陣列
                output.value = `strokes: [\n${resultStrings.map(s => `      '${s}',`).join('\n')}\n    ],`;
            }
        } else {
            output.value = '';
        }
    }

    function objectToString(obj, indentLevel = 1) {
        const indent = '  '.repeat(indentLevel);
        const prevIndent = '  '.repeat(indentLevel - 1);
        let str = '{\n';
        
        for (const key in obj) {
            const value = obj[key];
            str += `${indent}${key}: `;
            
            if (key === 'strokes' && Array.isArray(value)) {
                str += '[\n';
                value.forEach(v => {
                    str += `${indent}  '${v}',\n`;
                });
                str += `${indent}],\n`;
            } else if (Array.isArray(value)) {
                str += `[${value.map(v => `'${v}'`).join(', ')}],\n`;
            } else if (typeof value === 'string') {
                str += `'${value}',\n`;
            } else if (typeof value === 'object' && value !== null) {
                str += objectToString(value, indentLevel + 1) + ',\n';
            } else {
                str += `${value},\n`;
            }
        }
        str += `${prevIndent}}`;
        return str;
    }

    // --- 滑鼠事件 ---
    function getMousePos(e) {
        const rect = canvas.getBoundingClientRect();
        return { x: e.clientX - rect.left, y: e.clientY - rect.top };
    }

    function findPointInfo(pos) {
        for (let s = strokes.length - 1; s >= 0; s--) {
            const points = strokes[s];
            for (let p = points.length - 1; p >= 0; p--) {
                const pt = points[p];
                const dist = Math.sqrt((pt.x - pos.x)**2 + (pt.y - pos.y)**2);
                if (dist <= HIT_RADIUS) {
                    return { sIdx: s, pIdx: p };
                }
            }
        }
        return null;
    }

    canvas.addEventListener('mousedown', (e) => {
        const pos = getMousePos(e);
        const hit = findPointInfo(pos);
        
        if (e.button === 0) {
            if (hit) {
                isDragging = true;
                dragStrokeIndex = hit.sIdx;
                dragPointIndex = hit.pIdx;
            } else {
                if (strokes.length === 0) strokes.push([]);
                const currentStroke = strokes[strokes.length - 1];
                currentStroke.push(pos);
                isDragging = true;
                dragStrokeIndex = strokes.length - 1;
                dragPointIndex = currentStroke.length - 1;
                render();
            }
        }
    });

    canvas.addEventListener('mousemove', (e) => {
        const pos = getMousePos(e);
        if (isDragging && dragStrokeIndex !== -1 && dragPointIndex !== -1) {
            strokes[dragStrokeIndex][dragPointIndex] = pos;
            render();
        } else {
            const hit = findPointInfo(pos);
            if (hit) {
                hoverStrokeIndex = hit.sIdx;
                hoverPointIndex = hit.pIdx;
                canvas.classList.toggle('hovering-point', true);
            } else {
                hoverStrokeIndex = -1;
                hoverPointIndex = -1;
                canvas.classList.toggle('hovering-point', false);
            }
            render();
        }
    });

    canvas.addEventListener('mouseup', () => {
        isDragging = false;
        dragStrokeIndex = -1;
        dragPointIndex = -1;
        render();
    });

    canvas.addEventListener('mouseleave', () => {
        isDragging = false;
        render();
    });

    canvas.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        const pos = getMousePos(e);
        const hit = findPointInfo(pos);
        if (hit) {
            strokes[hit.sIdx].splice(hit.pIdx, 1);
            if (strokes[hit.sIdx].length === 0 && strokes.length > 1) {
                strokes.splice(hit.sIdx, 1);
            }
            render();
        }
    });
    
    canvas.addEventListener('dblclick', (e) => {
        e.preventDefault();
        nextStroke();
    });

    // 4. 掛載到 Window
    window.openCharPicker = openCharPicker;
    window.closeCharPicker = closeCharPicker;
    window.selectChar = selectChar;
    window.renderPicker = renderPicker;
    window.drawGuide = drawGuide;
    window.updateSmoothness = updateSmoothness;
    window.undo = undo;
    window.clearPath = clearPath;
    window.copyCode = copyCode;
    window.importPath = importPath;

    // 初始化
    drawGuide();
</script>
</body>
</html>
